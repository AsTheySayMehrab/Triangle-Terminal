name: Build Windows preview

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/packaging/package-lock.json
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:smoke
      - name: Build unsigned portable executable
        run: npm run dist
      - name: Test the packaged application
        run: npm run test:packaged
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath release -Filter '*.exe' -File
          if (!$files) { throw 'Portable executable is missing' }
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: triangle-terminal-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaged test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-results
          path: |
            test-results/packaged/*.json
            test-results/packaged/*.png
          if-no-files-found: ignore
          retention-days: 7
